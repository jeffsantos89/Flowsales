replicaCount: 3

image:
  repository: flowsales/sales-service
  tag: latest
  pullPolicy: Always

env:
  ENVIRONMENT: production
  JWT_SECRET: prod-secret
  DB_HOST: sales-service-db
  DB_PORT: 5432
  DB_NAME: sales_service_prod
  DB_USER: prod_user
  DB_PASSWORD: prod_pass

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi