
replicaCount: 1

image:
  repository: flowsales/page-builder-service
  tag: dev
  pullPolicy: IfNotPresent

env:
  ENVIRONMENT: development
  JWT_SECRET: dev-secret
  DB_HOST: page-builder-db
  DB_PORT: 5432
  DB_NAME: page_builder_dev
  DB_USER: dev_user
  DB_PASSWORD: dev_pass

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi
