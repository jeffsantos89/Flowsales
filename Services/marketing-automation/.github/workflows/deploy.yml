apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-automation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: marketing-automation
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: marketing-automation
    spec:
      containers:
        - name: marketing-service
          image: your-registry/marketing-service:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: marketing-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: marketing-storage
              mountPath: /data
      volumes:
        - name: marketing-storage
          persistentVolumeClaim:
            claimName: marketing-pvc
      restartPolicy: Always
