type: Load Test
config:
  target: ${TARGET_URL}
  phases:
    - duration: 300  # 5 minutos
      arrivalRate: 50  # 50 requisições por segundo
    - duration: 600  # 10 minutos
      arrivalRate: 100  # 100 requisições por segundo
    - duration: 300  # 5 minutos
      arrivalRate: 200  # 200 requisições por segundo
scenarios:
  - name: Test Leads API
    flow:
      - get:
          url: "/api/leads"
          check:
            - status: 200
      - post:
          url: "/api/leads"
          json:
            name: "Teste Lead"
            email: "test@example.com"
            source: "API Test"
          check:
            - status: 201
  - name: Test Campaigns API
    flow:
      - get:
          url: "/api/campaigns"
          check:
            - status: 200
      - post:
          url: "/api/campaigns"
          json:
            name: "Campanha Teste"
            type: "Email"
          check:
            - status: 201
