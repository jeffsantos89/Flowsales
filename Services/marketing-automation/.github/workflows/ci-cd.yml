name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Lint Code
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Build Project
        run: npm run build

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Run Vulnerability Scanner
        run: npx snyk test

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, security]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: docker build -t myrepo/marketing-automation-service:latest .

      - name: Push Docker Image
        run: docker push myrepo/marketing-automation-service:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup kubectl
        run: |
          curl -LO "https://storage.googleapis.com/kubernetes-release/release/$(curl -s https://storage.googleapis.com/kubernetes-release/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Configure kubectl
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: Apply Kubernetes Manifests
        run: kubectl apply -f kubernetes/

  notify:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs: [build, security, docker, deploy]
    if: always()

    steps:
      - name: Send Notification on Failure
        if: failure()
        run: curl -X POST -H 'Content-type: application/json' --data '{"text":"CI/CD Pipeline Failed!"}' https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK

      - name: Send Notification on Success
        if: success()
        run: curl -X POST -H 'Content-type: application/json' --data '{"text":"CI/CD Pipeline Succeeded!"}' https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK
      
