apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-agent
  labels:
    app: zabbix-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zabbix-agent
  template:
    metadata:
      labels:
        app: zabbix-agent
    spec:
      containers:
        - name: zabbix-agent
          image: zabbix/zabbix-agent:latest
          env:
            - name: ZBX_SERVER_HOST
              value: "zabbix-server"
          ports:
            - containerPort: 10050
