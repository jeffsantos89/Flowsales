apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        monitor: 'marketing-automation-monitor'
    rule_files:
      - 'alert.rules'
      - 'recording.rules'
    scrape_configs:
      - job_name: 'kubernetes'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: marketing-automation
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:9100
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'alertmanager:9093'
  alert.rules: |
    groups:
      - name: example
        rules:
          - alert: InstanceDown
            expr: up == 0
            for: 5m
            labels:
              severity: 'critical'
            annotations:
              summary: 'Instance {{ $labels.instance }} down'
              description: '{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 5 minutes.'
          - alert: HighMemoryUsage
            expr: node_memory_Active_bytes / node_memory_MemTotal_bytes > 0.9
            for: 5m
            labels:
              severity: 'warning'
            annotations:
              summary: 'High Memory Usage on {{ $labels.instance }}'
              description: 'Memory usage is above 90% on {{ $labels.instance }}.'
  recording.rules: |
    groups:
      - name: example
        rules:
          - record: job:http_inprogress_requests:sum
            expr: sum by (job) (http_inprogress_requests)
