apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: marketing
  name: marketing-role
  labels:
    app: marketing-automation
    environment: production
  annotations:
    description: Role for marketing automation service
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "watch", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "watch", "list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "watch", "list", "create", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: marketing-role-binding
  namespace: marketing
  labels:
    app: marketing-automation
    environment: production
  annotations:
    description: RoleBinding for marketing automation service
subjects:
  - kind: ServiceAccount
    name: marketing-service-account
    namespace: marketing
roleRef:
  kind: Role
  name: marketing-role
  apiGroup: rbac.authorization.k8s.io
