apiVersion: v1
kind: ConfigMap
metadata:
  name: email-integration-config
data:
  SMTP_HOST: smtp.mailgun.org
  SMTP_PORT: "587"
  SMTP_USER: no-reply@example.com
  SMTP_PASS: securepassword
  KAFKA_BROKER: kafka-broker:9092
  EMAIL_TOPIC: email_notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: email-integration
  template:
    metadata:
      labels:
        app: email-integration
    spec:
      containers:
        - name: email-integration
          image: your-registry/email-integration:latest
          envFrom:
            - configMapRef:
                name: email-integration-config
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          restartPolicy: Always
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: email-integration-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: email-integration-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
