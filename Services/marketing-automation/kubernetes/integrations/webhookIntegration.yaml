apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-config
data:
  CRM_WEBHOOK_URL: https://crm.example.com/webhook
  EMAIL_HOST: smtp.example.com
  EMAIL_FROM: no-reply@example.com

---
apiVersion: v1
kind: Secret
metadata:
  name: email-secret
type: Opaque
data:
  EMAIL_USER: dXNlckBleGFtcGxlLmNvbQ==  # Base64 encoded value of 'user@example.com'
  EMAIL_PASS: cGFzczEyMw==  # Base64 encoded value of 'pass123'
