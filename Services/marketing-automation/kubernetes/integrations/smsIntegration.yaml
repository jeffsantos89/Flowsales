apiVersion: v1
kind: ConfigMap
metadata:
  name: sms-integration-config
data:
  SMS_API_URL: https://api.twilio.com
  SMS_API_KEY: your_twilio_api_key
  SMS_API_SECRET: your_twilio_api_secret
  KAFKA_BROKER: kafka-broker:9092
  SMS_TOPIC: sms_notifications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-integration-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sms-integration
  template:
    metadata:
      labels:
        app: sms-integration
    spec:
      containers:
        - name: sms-integration
          image: your-registry/sms-integration:latest
          envFrom:
            - configMapRef:
                name: sms-integration-config
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - sms-integration
              topologyKey: "kubernetes.io/hostname"
      tolerations:
        - key: "key"
          operator: "Equal"
          value: "value"
          effect: "NoSchedule"
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  name: sms-integration-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sms-integration-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
