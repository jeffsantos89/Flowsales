apiVersion: v1
kind: ConfigMap
metadata:
  name: crm-config
  labels:
    app: crm-integration
  annotations:
    description: Configurações para integração com CRM
data:
  CRM_API_URL: https://crm.example.com/api
  CRM_API_KEY: your_api_key_here
  CRM_API_TIMEOUT: "30"  # Timeout em segundos
  CRM_API_RETRIES: "3"   # Número de tentativas em caso de falha
