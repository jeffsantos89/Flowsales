apiVersion: v1
kind: ResourceQuota
metadata:
  name: marketing-automation-limits
  annotations:
    description: "Resource limits for the marketing automation service"
spec:
  hard:
    cpu: "8"
    memory: "16Gi"
    pods: "50"
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    persistentvolumeclaims: "20"
    services: "20"
    services.loadbalancers: "5"
    services.nodeports: "10"
    configmaps: "20"
    secrets: "20"
    replicationcontrollers: "20"
    resourcequotas: "2"
    services.externalips: "5"
    ingresses.extensions: "10"
    storage.requests.storage: "100Gi"
