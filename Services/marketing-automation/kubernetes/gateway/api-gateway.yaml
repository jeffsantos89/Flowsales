apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway
spec:
  hosts:
    - "api.flowsale.com.br"
  gateways:
    - main-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: marketing-service
            port:
              number: 80
      headers:
        request:
          set:
            X-API-Key: "{{ request.headers['X-API-Key'] }}"
      corsPolicy:
        allowOrigins:
          - "*"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
        allowHeaders:
          - X-API-Key
          - Content-Type
        allowCredentials: true
        maxAge: "24h"
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: auth-service
            port:
              number: 80
      corsPolicy:
        allowOrigins:
          - "*"
        allowMethods:
          - GET
          - POST
        allowHeaders:
          - Authorization
          - Content-Type
        allowCredentials: true
        maxAge: "24h"
