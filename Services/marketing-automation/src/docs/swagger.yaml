openapi: 3.0.0
info:
  title: Marketing Automation API
  description: API para gestão de campanhas, leads, e integrações.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api

paths:
  /send-email:
    post:
      summary: Enviar Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                subject:
                  type: string
                html:
                  type: string
      responses:
        200:
          description: Email enviado com sucesso

  /send-sms:
    post:
      summary: Enviar SMS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phoneNumber:
                  type: string
                message:
                  type: string
      responses:
        200:
          description: SMS enviado com sucesso
