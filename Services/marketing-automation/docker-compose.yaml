version: '3.9'
services:
  marketing-automation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-automation-service
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres-db:5432/flowsale
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
    ports:
      - '3000:3000'
    depends_on:
      - postgres-db
      - redis
      - kafka
    networks:
      - marketing-net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-marketing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - marketing-net

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:6.2-alpine
    ports:
      - '6379:6379'
    networks:
      - marketing-net

  kafka:
    image: bitnami/kafka:latest
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    networks:
      - marketing-net

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - '2181:2181'
    networks:
      - marketing-net

volumes:
  postgres_data:
  db_data:

networks:
  marketing-net:
    driver: bridge
