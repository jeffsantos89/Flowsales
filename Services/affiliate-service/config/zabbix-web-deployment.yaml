apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app: zabbix-web
spec:
  replicas: 1  # Apenas uma réplica para o frontend
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:latest  # Imagem oficial do Zabbix Web com Nginx e PostgreSQL
          env:
            - name: DB_SERVER_HOST
              value: "postgres-cluster"  # Nome do serviço PostgreSQL no cluster
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials  # Referência ao Secret contendo usuário do banco
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials  # Referência ao Secret contendo senha do banco
                  key: password
            - name: POSTGRES_DB
              value: "zabbix"  # Nome do banco de dados para o Zabbix
            - name: ZBX_SERVER_HOST
              value: "zabbix-server"  # Endereço do servidor Zabbix
          ports:
            - containerPort: 8080  # Porta padrão do Zabbix Web
          volumeMounts:
            - name: zabbix-web-config
              mountPath: /etc/zabbix/web.conf.d  # Monta configurações customizadas
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: zabbix-web-config
          configMap:
            name: zabbix-web-config  # Configuração customizada via ConfigMap (se houver)
      restartPolicy: Always

