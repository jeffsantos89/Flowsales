apiVersion: v1
kind: ConfigMap
metadata:
  name: waf-config
  namespace: default
data:
  nginx-waf.conf: |
    # Configuração básica do NGINX com WAF
    load_module modules/ngx_http_modsecurity_module.so;

    events { 
      worker_connections 1024; 
    }

    http {
      include       mime.types;
      default_type  application/octet-stream;

      # ModSecurity Configuração
      modsecurity on;
      modsecurity_rules_file /etc/nginx/modsecurity.conf;

      server {
        listen 80;
        server_name affiliate.example.com;

        location / {
          proxy_pass http://affiliate-service.default.svc.cluster.local:4000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modsecurity-rules
  namespace: default
data:
  modsecurity.conf: |
    # ModSecurity Core Rules
    SecRuleEngine On
    SecRequestBodyAccess On
    SecResponseBodyAccess Off
    SecRule REQUEST_HEADERS:User-Agent "curl" "id:1001,phase:1,deny,status:403,msg:'CURL access forbidden'"
    SecRule ARGS "(?:select.*from|union.*select|delete.*from)" "id:1002,phase:2,deny,status:403,msg:'SQL Injection Detected'"
    SecRule ARGS "<script>" "id:1003,phase:2,deny,status:403,msg:'XSS Detected'"
