version: '3.8'

services:
  affiliate-service:
    build: .
    container_name: affiliate-service
    environment:
      - PORT=4000
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=flowsale_affiliate
      - REDIS_HOST=redis
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - KAFKA_BROKER=kafka:9092
      - LOGSTASH_HOST=logstash:5044
      - NODE_ENV=production
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - postgres
      - redis
      - kafka
      - logstash
    ports:
      - '4000:4000'
    volumes:
      - ./certs:/app/certs  # Certificados SSL/TLS
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - affiliate-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowsale_affiliate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - affiliate-network

  redis:
    image: redis:alpine
    container_name: redis-cache
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - affiliate-network

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka-broker
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    networks:
      - affiliate-network

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    ports:
      - '2181:2181'
    networks:
      - affiliate-network

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.0
    container_name: logstash
    volumes:
      - ./logstash/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - '5044:5044'
    networks:
      - affiliate-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - affiliate-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - '3000:3000'
    networks:
      - affiliate-network

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  affiliate-network:
    driver: bridge

