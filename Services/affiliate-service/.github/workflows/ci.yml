name: CI - Affiliate Service

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: affiliates_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências
        run: npm install

      - name: Lint
        run: npm run lint || true

      - name: Testes com cobertura
        run: npm run test:cov

      - name: Docker Build
        run: docker build -t affiliate-service .

      - name: Relatório de cobertura
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/lcov-report
