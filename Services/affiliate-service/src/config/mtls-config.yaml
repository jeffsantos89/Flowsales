apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affiliate-service-ingress
  namespace: affiliate
  annotations:
    kubernetes.io/ingress.class: "nginx"

    # Configuração robusta de mTLS
    nginx.ingress.kubernetes.io/auth-tls-secret: "affiliate/affiliate-service-tls"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "3"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    nginx.ingress.kubernetes.io/auth-tls-error-page: "https://flowsale.com.br/error-pages/403"

    # Segurança adicional e proteção
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self';";

    # Configuração de observabilidade e tracing
    prometheus.io/scrape: "true"
    prometheus.io/port: "10254"
    prometheus.io/path: "/metrics"
spec:
  tls:
    - hosts:
        - affiliate.flowsale.com.br
      secretName: affiliate-service-tls
  rules:
    - host: affiliate.flowsale.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: affiliate-service
                port:
                  number: 4000
