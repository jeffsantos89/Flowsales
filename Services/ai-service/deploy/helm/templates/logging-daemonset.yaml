apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-logging
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-logging
    {{- include "ai-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-logging
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-logging
        {{- include "ai-service.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-logging.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-logging
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: fluentd
          image: "{{ .Values.logging.image.repository }}:{{ .Values.logging.image.tag }}"
          imagePullPolicy: {{ .Values.logging.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: {{ .Values.logging.resources.limits.cpu | default "200m" }}
              memory: {{ .Values.logging.resources.limits.memory | default "256Mi" }}
            requests:
              cpu: {{ .Values.logging.resources.requests.cpu | default "100m" }}
              memory: {{ .Values.logging.resources.requests.memory | default "128Mi" }}
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-logging-config
                  key: elasticsearch_host
            - name: FLUENT_ELASTICSEARCH_PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-logging-config
                  key: elasticsearch_port
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluentd/etc
          livenessProbe:
            httpGet:
              path: /metrics
              port: 24231
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: 24231
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: {{ .Release.Name }}-logging-config
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      terminationGracePeriodSeconds: 30
