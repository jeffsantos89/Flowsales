apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default "ai-service" }}
  namespace: {{ .Values.namespace | default "ai-service" }}
  labels:
    app: {{ .Values.service.name | default "ai-service" }}
    environment: {{ .Values.environment | default "production" }}
    release: {{ .Release.Name }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.port | default 5000 }}"
    {{- if .Values.service.annotations }}
    {{- toYaml .Values.service.annotations | nindent 4 }}
    {{- end }}
spec:
  selector:
    app: {{ .Values.service.name | default "ai-service" }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port | default 5000 }}
      targetPort: {{ .Values.service.targetPort | default 5000 }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort | default 30080 }}
      {{- end }}
  type: {{ .Values.service.type | default "ClusterIP" }}

  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- range .Values.service.loadBalancerSourceRanges }}
    - {{ . }}
    {{- end }}
  {{- end }}
  {{- end }}

  {{- if eq .Values.service.type "ClusterIP" }}
  clusterIP: {{ .Values.service.clusterIP | default "None" }}
  {{- end }}

  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
