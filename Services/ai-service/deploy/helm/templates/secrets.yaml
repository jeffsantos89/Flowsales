apiVersion: v1
kind: Secret
metadata:
  name: ai-service-secrets
  namespace: ai-service
  labels:
    app: ai-service
    managed-by: "Helm"
    environment: {{ .Values.environment | default "production" | quote }}
  annotations:
    managed-by: "Helm"
    environment: {{ .Values.environment | default "production" | quote }}
type: Opaque
immutable: true
data:
  {{- if .Values.secrets.database_url }}
  DATABASE_URL: {{ .Values.secrets.database_url | b64enc | quote }}
  {{- else }}
  DATABASE_URL: ""
  {{- end }}

  {{- if .Values.secrets.redis_password }}
  REDIS_PASSWORD: {{ .Values.secrets.redis_password | b64enc | quote }}
  {{- else }}
  REDIS_PASSWORD: ""
  {{- end }}

  {{- if .Values.secrets.additional_secret }}
  ADDITIONAL_SECRET: {{ .Values.secrets.additional_secret | b64enc | quote }}
  {{- else }}
  ADDITIONAL_SECRET: ""
  {{- end }}

  {{- range $key, $value := .Values.secrets.additionalSecrets }}
  {{ $key | upper }}: {{ $value | b64enc | quote }}
  {{- end }}

  # API Credentials
  {{- if .Values.secrets.api_key }}
  API_KEY: {{ .Values.secrets.api_key | b64enc | quote }}
  {{- else }}
  API_KEY: ""
  {{- end }}

  {{- if .Values.secrets.api_secret }}
  API_SECRET: {{ .Values.secrets.api_secret | b64enc | quote }}
  {{- else }}
  API_SECRET: ""
  {{- end }}
