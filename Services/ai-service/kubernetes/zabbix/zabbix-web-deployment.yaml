apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app: zabbix
    component: frontend
  annotations:
    kubernetes.io/description: "Zabbix Web Interface"
spec:
  replicas: 2  # Aumentado para alta disponibilidade
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zabbix
      component: frontend
  template:
    metadata:
      labels:
        app: zabbix
        component: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:6.0-ubuntu-latest  # Versão específica em vez de latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_SERVER_HOST
              value: "postgres-cluster"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            - name: ZBX_SERVER_HOST
              value: "zabbix-server"
            - name: PHP_TZ
              value: "America/Sao_Paulo"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: zabbix-web-config
              mountPath: /etc/zabbix/web
      volumes:
        - name: zabbix-web-config
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - zabbix
                topologyKey: kubernetes.io/hostname
