# kubernetes/cache/rate-limit.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-service-ingress
  namespace: ai-services
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/limit-rate-after: "100"
    nginx.ingress.kubernetes.io/limit-rate: "10"
    nginx.ingress.kubernetes.io/limit-req-zone-name: "default"
    nginx.ingress.kubernetes.io/limit-req-zone-size: "10m"
    nginx.ingress.kubernetes.io/limit-req-zone-burst: "10"
    nginx.ingress.kubernetes.io/limit-req-zone-no-delay: "true"
    nginx.ingress.kubernetes.io/limit-req-zone-redis: "true"
    nginx.ingress.kubernetes.io/limit-req-zone-redis-server: "redis://redis-cluster.cache.svc.cluster.local:6379"

    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    nginx.ingress.kubernetes.io/custom-http-errors: "404,403,500,503"
    nginx.ingress.kubernetes.io/load-balance: "round_robin"

    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains; preload";
      more_set_headers "Content-Security-Policy: default-src 'self'";
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "Feature-Policy: geolocation 'none'; microphone 'none'; camera 'none'";

    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecRequestBodyAccess On
      SecResponseBodyAccess On
      SecRequestBodyLimit 13107200
      SecRequestBodyNoFilesLimit 131072
      SecRequestBodyInMemoryLimit 131072
      SecResponseBodyLimit 524288
      SecResponseBodyMimeType text/plain text/html text/xml
      SecRule REQUEST_HEADERS:Content-Type "text/xml" "phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
      SecRule REQUEST_HEADERS:Content-Type "application/json" "phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
      SecRule REQUEST_HEADERS:Content-Type "multipart/form-data" "phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=URLENCODED"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-service.example.com
      secretName: ai-service-tls
  rules:
    - host: ai-service.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 4000
