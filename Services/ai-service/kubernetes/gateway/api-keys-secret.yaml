apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: api-keys
  namespace: gateway
  labels:
    app: kong
    environment: production
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
spec:
  encryptedData:
    kong-admin-token: "<encrypted-value>"
    jwt-secret: "<encrypted-value>"
  rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: gateway
  name: kong-secret-access
  labels:
    app: kong
    environment: production
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["api-keys"]
    verbs: ["get"]
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kong-secret-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: gateway
  name: kong-secret-binding
  labels:
    app: kong
    environment: production
subjects:
  - kind: ServiceAccount
    name: kong-service-account
    namespace: gateway
roleRef:
  kind: Role
  name: kong-secret-access
  apiGroup: rbac.authorization.k8s.io
