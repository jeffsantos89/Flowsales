apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-secret
  namespace: cdn
type: Opaque
data:
  CLOUDFLARE_API_KEY: {{ .Values.cloudflare.apiKey | b64enc }}
  CLOUDFLARE_EMAIL: {{ .Values.cloudflare.email | b64enc }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudflare-ingress
  namespace: cdn
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/whitelist-source-range: "173.245.48.0/20, 103.21.244.0/22"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($http_cf_connecting_ip = "") {
        return 403;
      }
    nginx.ingress.kubernetes.io/enable-access-log: "true"
    nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - example.com
      secretName: cloudflare-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
