apiVersion: 1
datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080
    basicAuth: true
    basicAuthUser: ${ZABBIX_USER}
    secureJsonData:
      basicAuthPassword: ${ZABBIX_PASSWORD}
    jsonData:
      timeoutSeconds: 30
      tlsSkipVerify: false
    editable: false
    version: 1
    
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: '15s'
      queryTimeout: '30s'
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: 'Bearer ${PROM_TOKEN}'
    editable: false
    version: 1

deleteDatasources:
  - name: Zabbix
    orgId: 1
  - name: Prometheus
    orgId: 1
