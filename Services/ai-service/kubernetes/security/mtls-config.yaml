apiVersion: v1
kind: Secret
metadata:
  name: mtls-cert
  namespace: security
  labels:
    app.kubernetes.io/name: ai-service-mtls
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: ai-platform
    environment: production
type: kubernetes.io/tls
data:
  tls.crt: <SEU_CERTIFICADO_BASE64>
  tls.key: <SUA_CHAVE_PRIVADA_BASE64>
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-service-ingress-mtls
  namespace: security
  labels:
    app.kubernetes.io/name: ai-service-ingress
    app.kubernetes.io/component: networking
    app.kubernetes.io/part-of: ai-platform
    environment: production
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "security/mtls-cert"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/ssl-ciphers: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-Api-Key"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-api.flowsale.com.br
      secretName: mtls-cert
  rules:
    - host: ai-api.flowsale.com.br
      http:
        paths:
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: ai-service
                port:
                  number: 443
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: ai-service-mtls
  namespace: security
  labels:
    app.kubernetes.io/name: ai-service-mtls
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: ai-platform
    environment: production
spec:
  mtls:
    mode: STRICT
  selector:
    matchLabels:
      app: ai-service
      environment: production
  portLevelMtls:
    443:
      mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ai-service-mtls
  namespace: security
  labels:
    app.kubernetes.io/name: ai-service-mtls
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: ai-platform
    environment: production
spec:
  host: "*.security.svc.cluster.local"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      minProtocolVersion: TLSV1_3
      maxProtocolVersion: TLSV1_3
    connectionPool:
      tcp:
        maxConnections: 1000
        connectTimeout: 20ms
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        maxRequestsPerConnection: 20
        http2MaxRequests: 1000
        maxRetries: 3
        idleTimeout: 15s
        http2:
          maxConcurrentStreams: 100
    outlierDetection:
      consecutive5xxErrors: 7
      interval: 15s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 50
    loadBalancer:
      simple: ROUND_ROBIN
      consistentHash:
        minimumRingSize: 1024
