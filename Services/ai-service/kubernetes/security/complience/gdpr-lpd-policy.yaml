apiVersion: v1
kind: ConfigMap
metadata:
  name: data-protection-policy
  namespace: security
  labels:
    app: flowsale
    component: compliance
data:
  data_protection: |
    user_data:
      storage:
        encryption:
          algorithm: AES-256-GCM
          key_rotation: 90d
          at_rest: true
          in_transit: true
        backup:
          enabled: true
          frequency: 24h
          retention: 90d
      access:
        role_based:
          enabled: true
          min_privilege: true
          mfa_required: true
        audit:
          enabled: true
          trail_retention: 365d
    logging:
      retention:
        period: 30d
        critical_data: 365d
      anonymization:
        enabled: true
        methods:
          - pseudonymization
          - encryption
          - data_masking
      monitoring:
        alerts: true
        violations_reporting: true
    right_to_be_forgotten:
      enabled: true
      process:
        max_completion_time: 72h
        cascade_deletion: true
        verification_required: true
      audit:
        request_tracking: true
        completion_notification: true
    data_portability:
      enabled: true
      formats:
        - JSON
        - CSV
        - XML
      max_response_time: 48h
    breach_notification:
      enabled: true
      response_time: 72h
      notification_channels:
        - email
        - api_webhook
