pci_dss:
  version: "3.2.1"  # Specify PCI DSS version
  encryption:
    data_at_rest: "AES-256-GCM"
    data_in_transit: "TLS-1.3"
    key_rotation: 
      enabled: true
      interval_days: 90

  tokenization:
    enabled: true
    provider: "vault"
    token_format: "format-preserving"
    retention_period: "90d"

  firewall_rules:
    inbound:
      allow:
        - host: "payments.flowsale.com"
          ports: [443]
          protocols: ["HTTPS"]
      rate_limiting:
        requests_per_second: 1000
        burst: 2000
    outbound:
      deny: all
      exceptions:
        - destination: "logs.company.com"
          purpose: "audit-logs"

  access_control:
    multi_factor_auth:
      required: true
      methods:
        - "authenticator-app"
        - "hardware-token"
      grace_period: "0s"
    
    session:
      timeout: 15m
      max_concurrent: 1
      idle_timeout: 5m
    
  monitoring:
    logging:
      enabled: true
      retention_days: 365
    alerts:
      - type: "unauthorized_access"
      - type: "suspicious_activity"
      - type: "compliance_violation"

  audit:
    enabled: true
    log_level: "INFO"
    store_days: 365

  backup:
    encryption: true
    frequency: "daily"
    retention_days: 90
