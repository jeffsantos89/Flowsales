apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: ai-service
  labels:
    app: ai-service
    environment: production
    managed-by: kubernetes
    tier: backend
  annotations:
    description: "JWT secret for ai-service service"
    created-by: "admin"
    last-updated: "2023-10-01"
type: Opaque
stringData:
  JWT_SECRET: my-secret-key  # 'stringData' allows you to provide the secret as plain text
