# Policy for AI Service
# This policy defines access control for AI service secrets

path:
  # AI Service specific secrets
  "secret/data/ai-service/*":
    capabilities: ["read", "list"]
    denied_parameters:
      "restricted_*": []

  # Global secrets access
  "secret/data/global/*":
    capabilities: ["read", "list"]
    denied_parameters:
      "restricted_*": []

  # Allow checking metadata
  "secret/metadata/ai-service/*":
    capabilities: ["list", "read"]

  "secret/metadata/global/*":
    capabilities: ["list", "read"]

  # Audit logging capabilities
  "sys/audit/*":
    capabilities: ["read"]

  # Allow health check
  "sys/health":
    capabilities: ["read"]

# Rate limiting
rate_limit:
  rate: "100/s"
  interval: "1s"
