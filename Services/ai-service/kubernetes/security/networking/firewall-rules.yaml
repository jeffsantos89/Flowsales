groups:
  - name: "allow-internal"
    allow:
      networks:
        - name: "vpc-network"
          cidr: "10.0.0.0/16"
          description: "Internal VPC network"
          priority: 100
        - name: "office-network"
          cidr: "192.168.1.0/24"
          description: "Office network range"
          priority: 200
  - name: "deny-external"
    deny:
      networks:
        - name: "block-all"
          cidr: "0.0.0.0/0"
          description: "Block all other traffic"
          priority: 1000
ingress:
  enabled: true
  log_violations: true
  rate_limiting:
    enabled: true
    requests_per_second: 100
egress:
  enabled: true
  log_violations: true
monitoring:
  enabled: true
  metrics_retention_days: 30
  alert_on_violations: true
