# Enable ModSecurity engine
SecRuleEngine On

# Basic configurations
SecRequestBodyAccess On
SecResponseBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyLimit 524288

# Enable JSON, XML and multipart request body parsing
SecRule REQUEST_HEADERS:Content-Type "(?:application(?:/soap\+)?|text/)xml" \
    "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "application/json" \
    "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# SQL Injection Protection
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|XML:/* "@detectSQLi" \
    "id:1001,phase:2,block,log,msg:'SQL Injection Attack Detected',severity:CRITICAL,\
    tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-sqli',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# XSS Protection
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|REQUEST_COOKIES_NAMES|REQUEST_HEADERS|XML:/* "@detectXSS" \
    "id:1002,phase:2,block,log,msg:'XSS Attack Detected',severity:CRITICAL,\
    tag:'application-multi',tag:'language-multi',tag:'platform-multi',tag:'attack-xss',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# Path Traversal Protection
SecRule REQUEST_URI|ARGS|ARGS_NAMES|REQUEST_HEADERS "@detectPathTraversal" \
    "id:1003,phase:2,block,log,msg:'Path Traversal Attack Detected',severity:CRITICAL"

# File Upload Protection
SecRule FILES_NAMES "@rx .*\.(php|phtml|php3|php4|php5|pl|py|jsp|asp|htm|html|exe|sh)$" \
    "id:1004,phase:2,block,log,msg:'Malicious File Upload Attempted',severity:CRITICAL"

# Rate Limiting
SecRule IP:bf_block "@gt 0" \
    "id:1005,phase:1,deny,status:429,log,msg:'Rate Limit Exceeded'"

# Logging Configuration
SecAuditEngine RelevantOnly
SecAuditLog /var/log/modsec_audit.log
SecAuditLogParts ABDEFHIJZ

# Default Action
SecDefaultAction "phase:2,deny,log,status:403"
