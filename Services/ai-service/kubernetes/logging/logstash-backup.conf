input {
    file {
        path => "/var/log/backup/*.log"
        start_position => "beginning"
        sincedb_path => "/var/lib/logstash/sincedb"
        type => "backup_logs"
        codec => json
        ignore_older => 86400 # ignora arquivos mais antigos que 24h
        close_older => 1800 # fecha arquivos não modificados após 30min
    }
}

filter {
    if [type] == "backup_logs" {
        grok {
            match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:loglevel} %{GREEDYDATA:message}" }
            tag_on_failure => ["_grokparsefailure"]
            overwrite => ["message"]
        }
        
        date {
            match => [ "timestamp", "ISO8601" ]
            target => "@timestamp"
            remove_field => [ "timestamp" ]
        }

        mutate {
            add_field => {
                "environment" => "${ENVIRONMENT:production}"
                "app" => "backup-service"
            }
            remove_field => [ "@version" ]
        }
    }
}

output {
    elasticsearch {
        hosts => ["${ES_HOST:http://elasticsearch:9200}"]
        index => "backup-logs-%{+YYYY.MM.dd}"
        template_name => "backup_logs"
        template_overwrite => true
        retry_on_conflict => 5
        document_type => "_doc"
        manage_template => true
        ilm_enabled => true
        ilm_rollover_alias => "backup-logs"
        ilm_pattern => "{now/d}-000001"
        pipeline => "backup-logs-pipeline"
        sniffing => true
        timeout => 30
    }

    # Backup de logs para arquivo local
    file {
        path => "/var/log/logstash/failed_events_%{+YYYY-MM-dd}.log"
        codec => json
        only_on_error => true
    }
}
