apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: database
spec:
  schedule: "0 */6 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: pg-backup
              image: postgres:15
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "500m"
                limits:
                  memory: "512Mi"
                  cpu: "1"
              env:
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
                - name: POSTGRES_DB
                  value: "my_database"
                - name: AWS_S3_BUCKET
                  value: "s3://my-postgres-backup"
                - name: AWS_ROLE_ARN
                  value: "arn:aws:iam::123456789012:role/backup-role"
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: slack-secret
                      key: webhook-url
              volumeMounts:
                - name: backup-volume
                  mountPath: /backup
                - name: log-storage
                  mountPath: "/var/log/backup"
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -e
                  pg_dump -h postgres -U $POSTGRES_USER $POSTGRES_DB > /backup/db_backup.sql
                  aws s3 cp /backup/db_backup.sql $AWS_S3_BUCKET/db_backup_$(date +%F).sql
                  curl -X POST --data '{"text":"✅ Backup realizado com sucesso no AI-SERVICE!"}' $SLACK_WEBHOOK_URL
          restartPolicy: OnFailure
          volumes:
            - name: backup-volume
              emptyDir: {}
            - name: log-storage
              emptyDir: {}
          nodeSelector:
            backup: "true"
          tolerations:
            - key: "backup"
              operator: "Equal"
              value: "true"
              effect: "NoSchedule"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
