apiVersion: v1
kind: ConfigMap
metadata:
        name: nginx-config
        namespace: ai
data:
        nginx.conf: |
                user nginx;
                worker_processes auto;
                worker_rlimit_nofile 65535;
                pid /var/run/nginx.pid;

                events {
                        worker_connections 65535;
                        multi_accept on;
                        use epoll;
                }

                http {
                        charset utf-8;
                        sendfile on;
                        tcp_nopush on;
                        tcp_nodelay on;
                        server_tokens off;
                        log_not_found off;
                        types_hash_max_size 2048;
                        client_max_body_size 16M;

                        # MIME
                        include /etc/nginx/mime.types;
                        default_type application/octet-stream;

                        # Logging
                        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                                                                                        '$status $body_bytes_sent "$http_referer" '
                                                                                        '"$http_user_agent" "$http_x_forwarded_for"';
                        access_log /var/log/nginx/access.log main buffer=512k flush=1m;
                        error_log /var/log/nginx/error.log warn;

                        # SSL
                        ssl_session_timeout 1d;
                        ssl_session_cache shared:SSL:50m;
                        ssl_session_tickets off;
                        ssl_protocols TLSv1.2 TLSv1.3;
                        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
                        ssl_prefer_server_ciphers off;

                        # Load Balancing
                        upstream backend {
                                least_conn;
                                server marketing-service-1:3000 max_fails=3 fail_timeout=30s weight=1;
                                server marketing-service-2:3000 max_fails=3 fail_timeout=30s weight=1;
                                keepalive 32;
                        }

                        upstream ai-servers {
                                least_conn;
                                server ai-service-1:4000 max_fails=3 fail_timeout=30s weight=1;
                                server ai-service-2:4000 max_fails=3 fail_timeout=30s weight=1;
                                keepalive 32;
                        }

                        # Rate Limiting
                        limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

                        # Security Headers
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-XSS-Protection "1; mode=block" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "no-referrer-when-downgrade" always;
                        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
                        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

                        # Servers
                        server {
                                listen 80 default_server;
                                listen [::]:80 default_server;
                                server_name _;

                                # Health Check
                                location /health {
                                        access_log off;
                                        return 200 'healthy\n';
                                }

                                # Marketing Service
                                location /marketing/ {
                                        limit_req zone=one burst=20 nodelay;
                                        proxy_pass http://backend;
                                        proxy_http_version 1.1;
                                        proxy_set_header Upgrade $http_upgrade;
                                        proxy_set_header Connection 'upgrade';
                                        proxy_set_header Host $host;
                                        proxy_cache_bypass $http_upgrade;
                                        proxy_set_header X-Real-IP $remote_addr;
                                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                        proxy_set_header X-Forwarded-Proto $scheme;
                                        proxy_buffering on;
                                        proxy_buffer_size 4k;
                                        proxy_buffers 8 4k;
                                        proxy_connect_timeout 60s;
                                        proxy_send_timeout 60s;
                                        proxy_read_timeout 60s;
                                }

                                # AI Service
                                location /ai/ {
                                        limit_req zone=one burst=20 nodelay;
                                        proxy_pass http://ai-servers;
                                        proxy_http_version 1.1;
                                        proxy_set_header Upgrade $http_upgrade;
                                        proxy_set_header Connection 'upgrade';
                                        proxy_set_header Host $host;
                                        proxy_cache_bypass $http_upgrade;
                                        proxy_set_header X-Real-IP $remote_addr;
                                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                        proxy_set_header X-Forwarded-Proto $scheme;
                                        proxy_buffering on;
                                        proxy_buffer_size 4k;
                                        proxy_buffers 8 4k;
                                        proxy_connect_timeout 60s;
                                        proxy_send_timeout 60s;
                                        proxy_read_timeout 60s;
                                }

                                # Error Handling
                                error_page 500 502 503 504 /50x.html;
                                location = /50x.html {
                                        root /usr/share/nginx/html;
                                }
                        }
                }
