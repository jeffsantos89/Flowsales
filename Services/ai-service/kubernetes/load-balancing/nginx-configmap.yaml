apiVersion: v1
kind: ConfigMap
metadata:
        name: nginx-config
        namespace: ai
data:
        nginx.conf: |
                user nginx;
                worker_processes auto;
                worker_rlimit_nofile 65535;

                error_log /var/log/nginx/error.log warn;
                pid /var/run/nginx.pid;

                events {
                        worker_connections 4096;
                        use epoll;
                        multi_accept on;
                }

                http {
                        include /etc/nginx/mime.types;
                        default_type application/octet-stream;

                        # Logging Settings
                        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                                                                                        '$status $body_bytes_sent "$http_referer" '
                                                                                        '"$http_user_agent" "$http_x_forwarded_for"';
                        access_log /var/log/nginx/access.log main buffer=16k;

                        # Basic Settings
                        sendfile on;
                        tcp_nopush on;
                        tcp_nodelay on;
                        keepalive_timeout 65;
                        types_hash_max_size 2048;
                        server_tokens off;
                        client_max_body_size 16M;

                        # SSL Settings
                        ssl_protocols TLSv1.2 TLSv1.3;
                        ssl_prefer_server_ciphers on;
                        ssl_session_cache shared:SSL:10m;
                        ssl_session_timeout 10m;

                        # Gzip Settings
                        gzip on;
                        gzip_vary on;
                        gzip_proxied any;
                        gzip_comp_level 6;
                        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

                        # Security Headers
                        add_header X-Frame-Options "SAMEORIGIN" always;
                        add_header X-XSS-Protection "1; mode=block" always;
                        add_header X-Content-Type-Options "nosniff" always;
                        add_header Referrer-Policy "no-referrer-when-downgrade" always;
                        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

                        # Load Balancing Configuration
                        upstream ai-service {
                                least_conn;
                                server ai-service-1:4000 max_fails=3 fail_timeout=30s;
                                server ai-service-2:4000 max_fails=3 fail_timeout=30s;
                                keepalive 32;
                        }

                        upstream marketing-backend {
                                least_conn;
                                server marketing-service-1:3000 weight=5 max_fails=3 fail_timeout=30s;
                                server marketing-service-2:3000 weight=5 max_fails=3 fail_timeout=30s;
                                keepalive 32;
                        }

                        # Rate Limiting
                        limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

                        server {
                                listen 80 default_server;
                                listen [::]:80 default_server;
                                server_name _;

                                # Health Check
                                location /health {
                                        access_log off;
                                        return 200 "healthy\n";
                                }

                                location /ai-service/ {
                                        limit_req zone=one burst=20 nodelay;
                                        proxy_pass http://ai-service/;
                                        proxy_http_version 1.1;
                                        proxy_set_header Upgrade $http_upgrade;
                                        proxy_set_header Connection 'upgrade';
                                        proxy_set_header Host $host;
                                        proxy_set_header X-Real-IP $remote_addr;
                                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                        proxy_set_header X-Forwarded-Proto $scheme;
                                        proxy_cache_bypass $http_upgrade;
                                        proxy_connect_timeout 60s;
                                        proxy_send_timeout 60s;
                                        proxy_read_timeout 60s;
                                        proxy_buffering on;
                                        proxy_buffer_size 4k;
                                        proxy_buffers 8 4k;
                                        send_timeout 60s;

                                        # Error handling
                                        proxy_intercept_errors on;
                                        error_page 500 502 503 504 /50x.html;
                                }

                                location /marketing/ {
                                        limit_req zone=one burst=20 nodelay;
                                        proxy_pass http://marketing-backend/;
                                        proxy_http_version 1.1;
                                        proxy_set_header Upgrade $http_upgrade;
                                        proxy_set_header Connection 'upgrade';
                                        proxy_set_header Host $host;
                                        proxy_set_header X-Real-IP $remote_addr;
                                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                                        proxy_set_header X-Forwarded-Proto $scheme;
                                        proxy_cache_bypass $http_upgrade;
                                        proxy_connect_timeout 60s;
                                        proxy_send_timeout 60s;
                                        proxy_read_timeout 60s;
                                        proxy_buffering on;
                                        proxy_buffer_size 4k;
                                        proxy_buffers 8 4k;
                                        send_timeout 60s;
                                }

                                location /50x.html {
                                        root /usr/share/nginx/html;
                                        internal;
                                }
                        }
                }
