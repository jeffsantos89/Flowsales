apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-compression-config
  labels:
    app: nginx
    component: compression
data:
  nginx.conf: |
    # Enable compression
    gzip on;
    
    # Compression level (1-9, higher = better compression but more CPU)
    gzip_comp_level 6;
    
    # Minimum length to trigger compression
    gzip_min_length 256;
    
    # Buffer size for compression
    gzip_buffers 16 8k;
    
    # HTTP version requirement
    gzip_http_version 1.1;
    
    # Enable compression vary header
    gzip_vary on;
    
    # Disable compression for IE6
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";
    
    # Compress more file types
    gzip_types
      application/javascript
      application/json
      application/ld+json
      application/manifest+json
      application/xml
      font/eot
      font/otf
      font/ttf
      image/svg+xml
      text/css
      text/javascript
      text/plain
      text/xml;
    
    # Enable proxy compression
    gzip_proxied any;
