# Configuração principal do Alembic
[alembic]
script_location = alembic
sqlalchemy.url = ${DATABASE_URL}
timezone = UTC
version_locations = %(here)s/versions

# Segurança e robustez
retry_on_exception = True
retry_interval = 5  # Aumentado para evitar loops rápidos
max_retries = 5  # Maior tolerância para conexões instáveis

# Configurações de performance
transaction_per_migration = True
sourceless = true
compare_server_default = true

# Mecanismo de lock para evitar conflitos de concorrência
[alembic:exclude]
lock_file = alembic.lock
lock_timeout = 300  # 5 minutos

# Configuração avançada de logging
[loggers]
keys = root, alembic, sqlalchemy, alembic.runtime.migration

[handlers]
keys = console, file, rotating_file, syslog, email_handler

[formatters]
keys = generic, detailed, json

# Logger principal
[logger_root]
level = WARNING
handlers = console, rotating_file, syslog
qualname =

# Logger do Alembic
[logger_alembic]
level = INFO
handlers = console, rotating_file, email_handler
qualname = alembic
propagate = 0

# Logger do SQLAlchemy
[logger_sqlalchemy]
level = WARNING
handlers = console, rotating_file
qualname = sqlalchemy.engine
propagate = 0

# Logger das migrações do Alembic
[logger_alembic.runtime.migration]
level = INFO
handlers = console, rotating_file
qualname = alembic.runtime.migration
propagate = 0

# Configuração de Handlers de Log
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = detailed

[handler_file]
class = FileHandler
args = ('logs/alembic.log', 'a')
level = INFO
formatter = detailed

[handler_rotating_file]
class = logging.handlers.RotatingFileHandler
args = ('logs/alembic.log', 'a', 20971520, 5)  # 20MB por arquivo, 5 backups
level = INFO
formatter = json

[handler_syslog]
class = logging.handlers.SysLogHandler
args = ('/dev/log', 'local0')
level = WARNING
formatter = json  # Alterado para formato estruturado

[handler_email_handler]
class = logging.handlers.SMTPHandler
args = (('smtp.company.com', 25), 'alembic@company.com', ['admin@company.com'], '⚠️ Alembic Critical Error')
level = ERROR
formatter = detailed

# Formatação de Logs
[formatter_generic]
format = %(asctime)s [%(levelname)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[formatter_detailed]
format = %(asctime)s [%(levelname)s] %(name)s [%(process)d] [%(threadName)s] [%(filename)s:%(lineno)d] %(message)s
datefmt = %Y-%m-%d %H:%M:%S.%f%z

[formatter_json]
class = pythonjsonlogger.jsonlogger.JsonFormatter
format = %(asctime)s %(name)s %(levelname)s %(message)s %(filename)s %(module)s %(funcName)s %(lineno)d %(process)d %(thread)d %(threadName)s
