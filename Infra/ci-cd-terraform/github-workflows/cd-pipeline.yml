name: Flowsale CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ECR_REGISTRY }}
          ECR_REPOSITORY: flowsale
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Deploy to Kubernetes (EKS)
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update Kube config
        run: aws eks update-kubeconfig --name flowsale-cluster --region us-east-1

      - name: Deploy application
        run: |
          kubectl set image deployment/flowsale-app flowsale-container=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} -n production
