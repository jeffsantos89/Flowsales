apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  marketing-dashboard.json: |
    {
      "dashboard": {
        "title": "Marketing Service Dashboard",
        "panels": [
          {
            "type": "graph",
            "title": "API Requests per Minute",
            "targets": [
              {
                "expr": "rate(http_requests_total[1m])",
                "legendFormat": "{{handler}}"
              }
            ]
          },
          {
            "type": "gauge",
            "title": "CPU Usage",
            "targets": [
              {
                "expr": "sum(rate(container_cpu_usage_seconds_total[5m]))",
                "legendFormat": "CPU"
              }
            ]
          }
        ]
      }
    }
