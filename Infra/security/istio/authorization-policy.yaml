apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: flowsale-istio
spec: {}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-gateway
  namespace: flowsale-istio
spec:
  selector:
    matchLabels:
      app: nginx-waf
  rules:
    - from:
        - source:
            namespaces: ["istio-ingress"]
