apiVersion: v1
kind: Service
metadata:
  name: service-store-service
  labels:
    app: service-store-service
spec:
  selector:
    app: service-store-service
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  type: ClusterIP
  sessionAffinity: None
  ipFamilyPolicy: SingleStack
  ipFamilies:
    - IPv4
  publishNotReadyAddresses: false